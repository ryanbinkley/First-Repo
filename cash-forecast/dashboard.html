<html lang="en">

<title>Cash Forecast</title>
<style>

:root[data-theme="dark"] {

.wrap { max-width: 1320px; margin: 0 auto; padding: 20px 16px 60px; }

  background: var(--surface); color: var(--text); padding: 7px 12px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
:root[data-theme="dark"] button.primary { color: #0d1320; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #0d1320; } }
button.link { border: none; background: none; color: var(--accent); padding: 2px 4px; }
button.danger { color: var(--neg); }
button.icon { padding: 3px 8px; }
.banner { background: var(--warn-soft); border: 1px solid var(--edited-border); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }

.edit-table input.note { width: 100%; min-width: 220px; }

.settings input { width: 100%; }
.settings .box { border: 1px solid var(--border); border-radius: 10px; padding: 14px; }

.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
@media (max-width: 900px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}
@media (max-width: 480px) {
  .kpi .value { font-size: 21px; }

@media print {
  .actions, .tabs button:not(.active), .banner { display: none; }

</div>

}
function lastWeekTotals() {

    const f = Number(row.forecast || 0), a = row.actual == null || row.actual === "" ? null : Number(row.actual);

}

      <div class="note">Week ending ${fmtDate(low.week)}${below ? ` · <span class="neg">below ${fmtK(state.minCash)} cushion from ${fmtDate(below.week)}</span>` : ` · stays above ${fmtK(state.minCash)} cushion`}</div></div>

function renderChart(F) {
  const W = 760, H = 260, padL = 56, padR = 12, padT = 14, padB = 30;
  const vals = F.cols.map(c => c.end).concat([state.minCash, 0]);
  let max = Math.max(...vals), min = Math.min(...vals);
  const step = niceStep((max - min) / 4); max = Math.ceil(max / step) * step; min = Math.floor(min / step) * step;
  const y = v => padT + (H - padT - padB) * (1 - (v - min) / (max - min || 1));
  const bw = (W - padL - padR) / F.cols.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected ending cash by week">`;
  for (let v = min; v <= max + 1; v += step)
    s += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${fmtK(v)}</text>`;
  const low = F.cols.reduce((m, c) => c.end < m.end ? c : m, F.cols[0]);
  F.cols.forEach((c, i) => {
    const x = padL + i * bw + bw * 0.18, w = bw * 0.64, y0 = y(0), y1 = y(c.end);
    const color = c.end < state.minCash ? "var(--bar-low)" : "var(--bar)";
    s += `<rect x="${x}" y="${Math.min(y0, y1)}" width="${w}" height="${Math.max(1, Math.abs(y1 - y0))}" rx="3" fill="${color}">
      <title>Week ending ${fmtDate(c.week)}: ${fmt(c.end)}\nIn ${fmt(c.cin)} · Out ${fmt(c.cout)}</title></rect>`;
    if (i % (F.cols.length > 8 && W < 600 ? 2 : 1) === 0) s += `<text x="${x + w / 2}" y="${H - 10}" text-anchor="middle">${fmtDate(c.week)}</text>`;
    if (c === low) s += `<text x="${x + w / 2}" y="${Math.min(y0, y1) - 5}" text-anchor="middle" style="fill:var(--text);font-weight:600">${fmtK(c.end)}</text>`;
  });
  s += `<line x1="${padL}" x2="${W - padR}" y1="${y(state.minCash)}" y2="${y(state.minCash)}" stroke="var(--bar-low)" stroke-dasharray="5 4" stroke-width="1.5"/>
    <text x="${padL + 4}" y="${y(state.minCash) - 5}" text-anchor="start" style="fill:var(--bar-low)">Minimum cushion ${fmtK(state.minCash)}</text>`;
  $("chart").innerHTML = s + "</svg>";

}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function renderUpcoming(F) {
  const items = [];

    const c = F.cells[line.id][w];

      items.push({ w, name: line.name, amt: c.base, kind: line.kind, tag: c.override != null ? "adjusted" : "recurring" });
    for (const o of c.ones) if (o.amount >= 10000) items.push({ w, name: o.description || line.name, amt: Number(o.amount), kind: line.kind, tag: "one-time · " + line.name });
  }
  items.sort((a, b) => a.w < b.w ? -1 : a.w > b.w ? 1 : b.amt - a.amt);
  $("upcoming").innerHTML = items.length ? items.map(i => `<li><span class="when">${fmtDate(i.w)}</span>
    <span class="what">${esc(i.name)}<br><span class="tag">${esc(i.tag)}</span></span>
    <span class="amt ${i.kind === "in" ? "pos" : ""}">${i.kind === "in" ? "+" : "−"}${fmtK(i.amt)}</span></li>`).join("")

  const lineRow = line => `<tr><td title="${esc(line.note)}">${esc(line.name)}${line.note ? '<span class="dot"></span>' : ""}</td>${F.weeks.map(w => {
    const c = F.cells[line.id][w];
    const tip = [`Rule: ${fmt(c.rule)}`].concat(c.override != null ? [`Changed by hand to ${fmt(c.override)}`] : [])
      .concat(c.ones.map(o => `One-time: ${o.description || line.name} ${fmt(o.amount)}`)).join("\n");

  }).join("")}</tr>`;
  const totRow = (label, key, cls) => `<tr class="${cls || "total"}"><td>${label}</td>${F.cols.map(c => {

  const ins = state.lines.filter(l => l.kind === "in"), outs = state.lines.filter(l => l.kind === "out");
  p.innerHTML = `
    <p class="help">Type over any number to change it for that week. Changed cells turn
      <span class="legend"><span class="swatch" style="background:var(--edited);border:1px solid var(--edited-border)"></span>yellow</span>.

    <div class="scroll"><table class="grid">

      <p class="help">Do this once a week. It moves the forecast forward one week:</p>
      <ol class="help" style="padding-left:18px">
        <li>The week ending ${fmtDate(F.weeks[0])} becomes "last week", using its forecast for comparison.</li>
        <li>Starting cash is set to that week's forecasted ending cash (${fmt(F.cols[0].end)}).</li>
        <li>Then enter the actuals in <b>Last week vs. forecast</b> and click <b>Use as starting cash</b>.</li>
      </ol>
      <button id="s-roll" class="primary">Start week ending ${fmtDate(F.weeks[0])} →</button>
    </div>
    <div class="box"><h3>Saving your work</h3>
      <p class="help">Your edits are kept in this browser automatically, but to keep them for good (or send them to someone), click
      <b>Save a copy</b> at the top. It downloads a new version of this file with everything in it. Open that file next time.</p>
      <p class="help">Tip: name the files by week, e.g. <code>cash-forecast-${addDays(state.asOf, 7)}.html</code>.</p>
    </div></div>`;
  const num = (id, key) => $(id).addEventListener("change", e => { const v = parseMoney(e.target.value);
    if (v === null || Number.isNaN(v)) { alert("Please enter a number"); return render(); } state[key] = v; commit(); });
  num("s-cash", "startingCash"); num("s-min", "minCash");
  $("s-company").addEventListener("change", e => { state.company = e.target.value; commit(); });
  $("s-asof").addEventListener("change", e => { if (e.target.value) { state.asOf = e.target.value; commit(); } });
  $("s-roll").onclick = () => {
    const w = F.weeks[0];
    if (!confirm(`Start the week ending ${fmtDate(w, { year: "numeric" })}? The current "last week" comparison will be replaced.`)) return;
    const rows = {}; for (const l of state.lines) { const c = F.cells[l.id][w]; if (c.total) rows[l.id] = { forecast: c.total, actual: null }; }
    state.lastWeek = { weekEnding: w, startCash: state.startingCash, rows };
    state.startingCash = Math.round(F.cols[0].end * 100) / 100; state.asOf = w;
    for (const id of Object.keys(state.overrides)) { for (const k of Object.keys(state.overrides[id])) if (k <= w) delete state.overrides[id][k];
      if (!Object.keys(state.overrides[id]).length) delete state.overrides[id]; }
    activeTab = "lastweek"; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x.dataset.tab === "lastweek"));
    commit();
  };
}

/* ---------------- save & theme ---------------- */
$("btn-save").onclick = () => {
  state.updatedAt = new Date().toISOString();
  const json = JSON.stringify(state).replace(/</g, "\\u003c");
  const html = PRISTINE.replace(/(<script id="state" type="application\/json">)[\s\S]*?(<\/script>)/, (_, a, b) => a + json + b);
  const blob = new Blob([html], { type: "text/html" }), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `cash-forecast-${state.asOf}.html`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  dirty = false; restoredFrom = null; render();
  $("status").textContent = "Saved — open the downloaded file next time";
};
(function () {
  let t = null; try { t = localStorage.getItem("cash-forecast-theme"); } catch (e) {}
  if (t) document.documentElement.dataset.theme = t;
  $("btn-theme").onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = next;
    try { localStorage.setItem("cash-forecast-theme", next); } catch (e) {}
  };
})();
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
render();
</script>
</body>
</html>
