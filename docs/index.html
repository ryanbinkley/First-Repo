<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* RADAR — scope (default) and plotting-table (light) themes */
:root {
  --bg: #0a0f0b; --surface: #0f1611; --surface-2: #142017; --text: #cdeccf; --muted: #7fa386;
  --border: #22352a; --accent: #5dff9a; --accent-ink: #04140a; --accent-soft: #10291a;
  --pos: #5dff9a; --neg: #ff6b57; --amber: #ffb000;
  --neg-soft: #2a1210; --warn-soft: #2a2108; --edited: #2b2408; --edited-border: #b98400;
  --bar: #3fcf7a; --bar-low: #ff6b57; --grid: #1a2a20; --glow: 0 0 8px rgba(93,255,154,.35);
  --scan: rgba(0,0,0,.18);
  --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-crt: "VT323", ui-monospace, Menlo, Consolas, monospace;
  --f-8bit: "Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #e9e1cb; --surface: #f5efdc; --surface-2: #ece3c8; --text: #2a2a1c; --muted: #6a6448;
  --border: #c8bb92; --accent: #4b5320; --accent-ink: #f5efdc; --accent-soft: #e2dcb8;
  --pos: #3f6b1f; --neg: #a3271c; --amber: #9a6a00;
  --neg-soft: #f1d6cc; --warn-soft: #f3e2a8; --edited: #f3df98; --edited-border: #b08a1c;
  --bar: #5c6b2e; --bar-low: #a3271c; --grid: #ddd2b0; --glow: none; --scan: transparent;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--f-body); }
:root:not([data-theme="light"]) body {
  background: radial-gradient(ellipse at 50% -10%, #12241a 0%, var(--bg) 60%) fixed, var(--bg);
}
/* faint CRT scanlines, scope theme only */
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(to bottom, transparent 0 2px, var(--scan) 2px 3px); }
.wrap { max-width: 1320px; margin: 0 auto; padding: 20px 16px 60px; }
header.top { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between;
  margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 14px; }
.scope { width: 54px; height: 54px; flex: none; }
.scope .ring { fill: none; stroke: var(--accent); stroke-opacity: .35; }
.scope .face { fill: var(--surface-2); stroke: var(--accent); stroke-opacity: .7; }
.scope .sweep { transform-origin: 27px 27px; animation: sweep 4s linear infinite; }
.scope .blip { fill: var(--amber); animation: blip 4s linear infinite; }
@keyframes sweep { to { transform: rotate(360deg); } }
@keyframes blip { 0%, 30% { opacity: 0; } 34% { opacity: 1; } 80%, 100% { opacity: .1; } }
@media (prefers-reduced-motion: reduce) { .scope .sweep, .scope .blip { animation: none; } }
.wordmark { font-family: var(--f-8bit); font-size: 22px; letter-spacing: .12em; color: var(--accent);
  text-shadow: var(--glow); margin: 0; line-height: 1.2; }
.callsign { font-family: var(--f-8bit); font-size: 8.5px; letter-spacing: .14em; color: var(--muted);
  text-transform: uppercase; margin-top: 6px; }
header.top .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status { font-size: 12px; color: var(--muted); }
.status.dirty { color: var(--amber); font-weight: 600; }
button { font: inherit; cursor: pointer; border-radius: 4px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); padding: 7px 12px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
:root:not([data-theme="light"]) button.primary { box-shadow: var(--glow); }
button.link { border: none; background: none; color: var(--accent); padding: 2px 4px; }
button.danger { color: var(--neg); }
button.icon { padding: 3px 8px; }
#btn-theme { font-family: var(--f-8bit); font-size: 8px; letter-spacing: .08em; padding: 9px 10px; }
.banner { background: var(--warn-soft); border: 1px solid var(--edited-border); border-radius: 4px;
  padding: 10px 14px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 14px 16px; position: relative; }
/* small corner ticks, like bezel markings */
.card::before, .card::after { content: ""; position: absolute; width: 8px; height: 8px; border-color: var(--accent); opacity: .55; }
.card::before { top: -1px; left: -1px; border-top: 1px solid; border-left: 1px solid; }
.card::after { bottom: -1px; right: -1px; border-bottom: 1px solid; border-right: 1px solid; }
.kpi .label { font-family: var(--f-8bit); color: var(--muted); font-size: 8.5px; text-transform: uppercase; letter-spacing: .1em; }
.kpi .value { font-family: var(--f-crt); font-size: 44px; line-height: 1; margin-top: 10px; letter-spacing: .02em; }
:root:not([data-theme="light"]) .kpi .value { text-shadow: 0 0 6px currentColor; }
.kpi .note { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.kpi.alert { border-color: var(--bar-low); background: var(--neg-soft); }
.kpi.alert .label::before { content: "▲ CONTACT · "; color: var(--neg); }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.row2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; margin-bottom: 16px; align-items: start; }
.card h2 { font-family: var(--f-8bit); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; margin: 2px 0 14px; color: var(--accent); }
.card h2 .hint { font-family: var(--f-body); font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 8px; letter-spacing: 0; text-transform: none; }
#chart svg { width: 100%; height: auto; display: block; }
#chart text { fill: var(--muted); font-family: var(--f-crt); font-size: 15px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none;
  padding: 11px 14px; color: var(--muted); white-space: nowrap; }
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--border); border-top: none; border-radius: 0 0 4px 4px; padding: 16px; }
.help { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.legend { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 14px; border-radius: 2px; display: inline-block; vertical-align: middle; }
.scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 4px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 0; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 8px; background: var(--surface-2); position: sticky; top: 0; }
.grid th { font-family: var(--f-crt); font-size: 17px; font-weight: 400; letter-spacing: .02em; }
td.txt, th.txt { text-align: left; }
.grid td, .edit-table td { font-family: var(--f-num); font-size: 13px; }
.grid td:first-child, .edit-table td.txt { font-family: var(--f-body); font-size: 14px; }
.grid th:first-child, .grid td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1;
  text-align: left; padding: 6px 10px; min-width: 190px; border-right: 1px solid var(--border); }
.grid th:first-child { background: var(--surface-2); z-index: 2; }
.grid td.num { padding: 6px 8px; }
.grid input.cell { width: 96px; border: 1px solid transparent; background: transparent; color: var(--text);
  text-align: right; font: 13px var(--f-num); padding: 5px 6px; border-radius: 3px; }
.grid input.cell:hover { border-color: var(--border); }
.grid input.cell:focus { outline: none; border-color: var(--accent); background: var(--surface-2); }
.grid input.cell.edited { background: var(--edited); border-color: var(--edited-border); }
.grid input.cell.zero { color: var(--muted); opacity: .6; }
.grid input.cell.has-one { font-weight: 650; color: var(--amber); }
.grid tr.section td { background: var(--surface-2); font-family: var(--f-8bit) !important; font-size: 8.5px !important;
  letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; text-align: left; }
.grid tr.section td:first-child { background: var(--surface-2); }
.grid tr.total td { font-weight: 650; border-top: 1px solid var(--border); }
.grid tr.ending td { font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.grid tr.ending td:first-child { background: var(--accent-soft); }
.grid td.low { color: var(--neg) !important; }
.grid td.low-bg { background: var(--neg-soft) !important; }
.grid .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); margin-left: 5px; vertical-align: middle; }
.edit-table td { padding: 6px 6px; vertical-align: top; text-align: left; }
.edit-table th { text-align: left; }
.edit-table input, .edit-table select, .settings input, .settings select {
  font: inherit; font-family: var(--f-body); color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 3px; padding: 5px 7px; }
.edit-table input.money, .settings input.money { font-family: var(--f-num); }
.edit-table input:focus, .edit-table select:focus, .settings input:focus { outline: none; border-color: var(--accent); }
.edit-table input.name { width: 200px; }
.edit-table input.money { width: 110px; text-align: right; }
.edit-table input.note { width: 100%; min-width: 220px; }
.edit-table td.when { min-width: 260px; }
.months { display: flex; gap: 2px; margin-top: 6px; flex-wrap: wrap; }
.months label { font-size: 11px; border: 1px solid var(--border); border-radius: 2px; padding: 1px 5px; cursor: pointer; user-select: none; }
.months label.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.months input { display: none; }
.next { color: var(--muted); font-size: 12px; margin-top: 4px; }
tr.past td { opacity: .5; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.settings label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.settings input { width: 100%; }
.settings .box { border: 1px solid var(--border); border-radius: 4px; padding: 14px; }
.settings .box h3 { font-family: var(--f-8bit); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.chartcard { margin-bottom: 16px; }
.grid td.c { padding: 3px 6px; vertical-align: top; position: relative; min-width: 104px; }
.grid td.c .amt { display: block; padding: 4px 6px; border: 1px solid transparent; border-radius: 3px; cursor: pointer; font-family: var(--f-num); font-size: 13px; }
.grid td.c .amt:hover { border-color: var(--accent); }
.grid td.c .amt[draggable=true] { cursor: grab; }
.grid td.c .amt.edited { background: var(--edited); border-color: var(--edited-border); }
.grid td.c .amt.zero { color: var(--muted); text-decoration: line-through; }
.grid td.c .empty { display: block; padding: 4px 6px; color: var(--muted); opacity: .5; }
.chip { display: block; margin: 2px 0 0 auto; width: fit-content; padding: 1px 8px; border-radius: 10px; background: var(--warn-soft);
  border: 1px solid var(--edited-border); color: var(--amber); font: 600 12px var(--f-num); cursor: grab; }
.chip.demo { display: inline-block; margin: 0 2px 0 0; cursor: default; }
.grid td.c .dragging { opacity: .35; }
.grid td.c.over { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }
.grid .addcell { position: absolute; left: 2px; top: 4px; width: 18px; height: 18px; padding: 0; line-height: 16px; font-size: 13px;
  border-radius: 50%; opacity: 0; color: var(--accent); border-color: var(--accent); background: var(--surface); }
.grid td.c:hover .addcell, .grid .addcell:focus { opacity: 1; }
.grid input.cellin { width: 96px; font: 13px var(--f-num); text-align: right; padding: 4px 6px; border: 1px solid var(--accent); border-radius: 3px; background: var(--surface-2); color: var(--text); }
.grid .linename { background: none; border: none; padding: 0; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.grid .linename:hover { color: var(--accent); text-decoration: underline; }
.grid .freq { display: block; font-size: 11px; color: var(--muted); }
button:disabled { opacity: .4; cursor: default; }
dialog.modal { border: 1px solid var(--accent); border-radius: 6px; background: var(--surface); color: var(--text); padding: 0; width: min(460px, calc(100vw - 32px)); }
dialog.modal::backdrop { background: rgba(0,0,0,.55); }
dialog.modal form { padding: 18px 18px 14px; }
dialog.modal h3 { font-family: var(--f-8bit); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
dialog.modal label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
dialog.modal input:not([type=radio]):not([type=checkbox]), dialog.modal select, dialog.modal textarea { width: 100%; font: inherit; color: var(--text); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 3px; padding: 6px 8px; }
dialog.modal input.money { font-family: var(--f-num); text-align: right; }
dialog.modal .two { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
dialog.modal .seg { display: flex; gap: 16px; margin: 6px 0 2px; }
dialog.modal .seg label { display: inline-flex; gap: 6px; align-items: center; margin: 0; color: var(--text); font-size: 14px; }
dialog.modal .months label { display: inline-block; margin: 0; }
dialog.modal .mbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
dialog.modal .mbtns .danger { margin-right: auto; }
dialog.modal .merr { color: var(--neg); font-size: 13px; margin-top: 10px; }
dialog.modal .mlist { margin-top: 14px; font-size: 13px; border-top: 1px solid var(--grid); padding-top: 8px; }
dialog.modal .mlist div { padding: 2px 0; color: var(--muted); }
table.outflows tr.wk td { border-top: 1px solid var(--border); }
table.outflows td.when { font-family: var(--f-crt); font-size: 17px; color: var(--muted); }
body.gated .kpis, body.gated .chartcard, body.gated .tabs, body.gated #panel, body.gated #outflows { display: none; }
.gatecard { max-width: 460px; margin: 40px auto; }
.gatecard h2 { margin-bottom: 10px; }
.gatecard form { display: flex; gap: 8px; flex-wrap: wrap; }
.gatecard input { flex: 1; min-width: 200px; font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 7px 9px; }
body.readonly #btn-add, body.readonly #btn-undo, body.readonly .addcell, body.readonly #imp-apply, body.readonly #s-roll, body.readonly #add-rule { display: none; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface-2); color: var(--text);
  border: 1px solid var(--accent); border-radius: 4px; padding: 9px 14px; z-index: 60; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
.a-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; padding: 3px 0; }
.a-add { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.a-add input { flex: 1; min-width: 180px; }
#published:empty { display: none; }
#published { font-size: 12px; }
.dropzone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 34px 16px;
  border: 1px dashed var(--accent); border-radius: 4px; cursor: pointer; background: var(--surface-2); text-align: center; }
.dropzone.over, .dropzone:hover { background: var(--accent-soft); }
.dz-title { font-family: var(--f-8bit); font-size: 10px; letter-spacing: .1em; color: var(--accent); text-transform: uppercase; }
.subhead { font-family: var(--f-8bit); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
.subhead .help { font-family: var(--f-body); text-transform: none; letter-spacing: 0; font-size: 12px; margin-left: 8px; }
table.mini td, table.mini th { padding: 6px 10px; font-family: var(--f-num); font-size: 13px; }
table.mini td.txt { font-family: var(--f-body); }
table.mini tr.total td { border-top: 1px solid var(--border); }
table.tx td { vertical-align: top; }
.txlist summary { cursor: pointer; margin-bottom: 10px; }
table.tx td.desc { white-space: normal; min-width: 260px; }
table.tx select { font: inherit; font-family: var(--f-body); color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 4px 6px; max-width: 260px; }
table.tx tr.ignored td { opacity: .45; }
table.tx tr.unassigned td { background: var(--warn-soft); }
code { font-family: var(--f-num); }
@media (max-width: 900px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 480px) {
  .kpi .value { font-size: 34px; }
  .wordmark { font-size: 18px; }
  .grid th:first-child, .grid td:first-child { min-width: 140px; }
}
@media print {
  body::after { display: none; }
  .actions, .tabs button:not(.active), .banner { display: none; }
}
</style>
</head>

"use strict";
// Snapshot of this file's original markup, used by "Save a copy" (must run before anything renders).
const PRISTINE = "<!doctype html>\n" + document.documentElement.outerHTML;
const EMBEDDED = JSON.parse(document.getElementById("state").textContent);
const CONFIG = JSON.parse(document.getElementById("config").textContent || "{}");
const CLOUD = !!CONFIG.supabaseUrl;
const LS_KEY = "radar-draft:" + location.pathname;
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- dates ---------------- */
const DAY = 864e5;
const D = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const iso = dt => dt.toISOString().slice(0, 10);
const addDays = (s, n) => iso(new Date(D(s).getTime() + n * DAY));
const daysBetween = (a, b) => Math.round((D(b) - D(a)) / DAY);
const fmtDate = (s, opts) => D(s).toLocaleDateString("en-US", Object.assign({ month: "short", day: "numeric", timeZone: "UTC" }, opts || {}));

/* ---------------- bank import ---------------- */
let pendingImport = null;
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(f); f = "";
      if (row.some(c => c.trim() !== "")) rows.push(row); row = []; }
    else f += ch;
  }
  row.push(f); if (row.some(c => c.trim() !== "")) rows.push(row);
  return rows;
}
const squash = s => String(s || "").toUpperCase().replace(/\s+/g, " ").trim();
function readBankFile(text) {
  const rows = parseCSV(text.replace(/^﻿/, ""));
  if (rows.length < 2) throw new Error("The file has no transactions in it.");
  const head = rows[0].map(h => h.trim().toLowerCase());
  const col = (...names) => { for (const n of names) { const i = head.indexOf(n); if (i >= 0) return i; } return -1; };
  const c = { date: col("post date", "posting date", "date"), amount: col("amount"), desc: col("description"), ref: col("reference"), ref2: col("additional reference"), trc: col("trc number", "trc"),
    text: col("text", "memo"), acct: col("account number", "account"), name: col("account name"), type: col("type") };
  if (c.date < 0 || c.amount < 0) throw new Error("Couldn't find the \"Post Date\" and \"Amount\" columns. Is this the Northrim account activity CSV?");
  const get = (r, i) => i >= 0 ? (r[i] || "").trim() : "";
  return rows.slice(1).map((r, n) => {
    const m = get(r, c.date).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/), amount = parseMoney(get(r, c.amount));
    if (!m || amount == null || Number.isNaN(amount)) return null;
    return { n, date: `${m[3]}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`, amount, acct: get(r, c.acct).slice(-4),
      acctName: get(r, c.name), desc: get(r, c.desc), ref: get(r, c.ref), ref2: get(r, c.ref2), trc: get(r, c.trc), text: get(r, c.text), type: get(r, c.type) };
  }).filter(Boolean);
}
function matchRule(t) {
  const hay = squash([t.ref, t.desc, t.text, t.type].join(" "));
  for (const r of state.importRules) {
    if (r.dir === "in" && t.amount <= 0) continue;
    if (r.dir === "out" && t.amount >= 0) continue;
    if (r.account && !t.acct.endsWith(String(r.account).trim())) continue;
    if (r.match && !hay.includes(squash(r.match))) continue;

  }

}
function categorize(pi) {

}
function startImport(fileName, text) {
  let txns;
  try { txns = readBankFile(text); } catch (e) { alert(e.message); return; }
  if (!txns.length) { alert("No transactions found in that file."); return; }
  const lw = state.lastWeek, apLine = state.lines.find(l => l.id === "ap") || state.lines.filter(l => l.kind === "out").slice(-1)[0];
  pendingImport = { fileName, text, txns, osStart: lw.osStart != null ? lw.osStart : 0, osEnd: state.osChecks != null ? state.osChecks : 0,
    osLine: apLine ? apLine.id : "" };
  categorize(pendingImport); render();
}
function importSummary(pi) {
  const sums = {}, lineById = Object.fromEntries(state.lines.map(l => [l.id, l]));
  let ignoredNet = 0, ignored = 0, unassigned = 0, bankNet = 0;
  const lw = state.lastWeek, from = addDays(lw.weekEnding, -6);
  const outside = pi.txns.filter(t => t.date < from || t.date > lw.weekEnding).length;
  for (const t of pi.txns) {

    if (t.lineId === "ignore") { ignored++; ignoredNet += t.amount; continue; }
    const l = lineById[t.lineId]; if (!l) { unassigned++; continue; }

  if (osChange && lineById[pi.osLine]) sums[pi.osLine] = (sums[pi.osLine] || 0) + (lineById[pi.osLine].kind === "out" ? osChange : -osChange);
  let tin = 0, tout = 0; for (const [id, v] of Object.entries(sums)) lineById[id].kind === "in" ? tin += v : tout += v;

function applyImport() {

  for (const l of state.lines) {

}

(function () {

/* ---------------- cloud mode (Supabase) ---------------- */
// Active only when the page is built with a Supabase URL + publishable key (build.py --cloud).
let sb = null, me = null, myRole = null, saveChain = Promise.resolve(), saving = 0, extraOps = [], refreshTimer = null, saveError = null;
const SB_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js";
const canEdit = () => !CLOUD || myRole === "editor" || myRole === "admin";

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Couldn't load " + src)); document.head.appendChild(s); });
}
function gate(html) {

async function cloudStart() {

  sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, {

    global: { headers: { "x-radar-via": "radar" } } });
  sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") location.reload(); });
  const { data } = await sb.auth.getSession();

  const who = await sb.rpc("whoami");
  if (who.error) return gate(`<div class="card gatecard"><p class="neg">${esc(who.error.message)}</p></div>`);

      <p class="help">Ask a Radar admin to add <b>${esc(me.email)}</b>.</p><button id="g-out">Sign out</button></div>`), $("g-out").onclick = () => sb.auth.signOut();

  await reloadFromServer(true);

  loadLastPublished();
  sb.channel("radar-changes")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "change_log" }, p => {
      if (p.new && p.new.user_id === me.id) return;              // our own change: already on screen
      scheduleRefresh(p.new && p.new.user_email);
    }).subscribe();
}
function signInScreen() {

async function reloadFromServer(first) {
  const { data, error } = await sb.rpc("radar_state");
  if (error || !data) return gate(`<div class="card gatecard"><p class="neg">Couldn't load Radar: ${esc(error ? error.message : "no data yet. Has the forecast been loaded?")}</p></div>`);
  state = data; normalize(); lastJSON = JSON.stringify(state);
  if (first) undoStack = [];
  gate(""); render();
}
function scheduleRefresh(who) {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    const busy = saving || pendingImport || dragData || document.querySelector("dialog[open]") || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    if (busy) return scheduleRefresh(who);
    undoStack = [];                                                 // someone else changed things: old undo steps no longer apply
    await reloadFromServer(false); loadLastPublished();
    toast(`Updated by ${who || "someone else"}`);
  }, 1200);
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}
function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); });
}

// Turn "before" and "after" app states into the list of database changes.
function diffOps(a, b) {
  const ops = [], late = [], J = JSON.stringify;
  const S = ["company", "asOf", "startingCash", "minCash", "flagMin", "osChecks", "weeks"];
  if (S.some(k => J(a[k]) !== J(b[k]))) ops.push(Object.assign({ t: "settings" }, ...S.map(k => ({ [k]: b[k] }))));
  const aL = new Map(a.lines.map((l, i) => [l.id, [l, i]])), bL = new Map(b.lines.map((l, i) => [l.id, [l, i]]));
  const sched = l => { const m = new Map([[null, l.rule]]); (l.changes || []).forEach(c => m.set(c.from, c.rule)); return m; };
  for (const [id, [l, i]] of bL) {
    const p = aL.get(id);
    if (!p || p[0].name !== l.name || p[0].kind !== l.kind || (p[0].note || "") !== (l.note || "") || p[1] !== i)
      ops.push({ t: "line", key: id, name: l.name, kind: l.kind, note: l.note || "", sort: i * 10 });
    const sa = p ? sched(p[0]) : new Map(), sbm = sched(l);
    for (const [from, rule] of sbm) if (!sa.has(from) || J(sa.get(from)) !== J(rule)) ops.push({ t: "schedule", key: id, from, rule });
    for (const from of sa.keys()) if (!sbm.has(from)) ops.push({ t: "schedule_delete", key: id, from });
  }
  for (const id of aL.keys()) if (!bL.has(id)) late.push({ t: "line_archive", key: id });
  const flat = s => { const m = new Map(); for (const [k, ws] of Object.entries(s.overrides || {})) for (const [w, v] of Object.entries(ws)) m.set(k + "|" + w, v); return m; };
  const oa = flat(a), ob = flat(b);
  for (const [kw, v] of ob) if (oa.get(kw) !== v) { const [key, week] = kw.split("|"); ops.push({ t: "override", key, week, amount: v }); }
  for (const kw of oa.keys()) if (!ob.has(kw) && bL.has(kw.split("|")[0])) { const [key, week] = kw.split("|"); ops.push({ t: "override_delete", key, week }); }
  const ia = new Map(a.oneTime.map(o => [o.id, o])), ib = new Map(b.oneTime.map(o => [o.id, o]));
  for (const [id, o] of ib) if (J(ia.get(id)) !== J(o)) ops.push({ t: "one", id, key: o.lineId, date: o.date, description: o.description || "", amount: o.amount });
  for (const id of ia.keys()) if (!ib.has(id)) ops.push({ t: "one_delete", id });
  const ra = new Map(a.importRules.map((r, i) => [r.id, [r, i]])), rb = new Map(b.importRules.map((r, i) => [r.id, [r, i]]));
  for (const [id, [r, i]] of rb) { const p = ra.get(id);
    if (r.lineId && (!p || J(p[0]) !== J(r) || p[1] !== i))      // rules with no category yet are saved once one is chosen
      ops.push({ t: "rule", id, priority: (i + 1) * 10, match: r.match || "", dir: r.dir || "any", account: r.account || "", line: r.lineId }); }
  for (const id of ra.keys()) if (!rb.has(id)) ops.push({ t: "rule_delete", id });
  const la = a.lastWeek || {}, lb = b.lastWeek;
  if (lb) {
    if (la.weekEnding !== lb.weekEnding || la.startCash !== lb.startCash || la.osStart !== lb.osStart || a.osChecks !== b.osChecks)
      ops.push({ t: "week", week: lb.weekEnding, startCash: lb.startCash, osStart: lb.osStart || 0, osEnd: b.osChecks || 0 });
    const same = la.weekEnding === lb.weekEnding, src = lb.imported && (!la.imported || la.imported.at !== lb.imported.at) ? "import" : "manual";
    const keys = new Set([...Object.keys(lb.rows || {}), ...(same ? Object.keys(la.rows || {}) : [])]);
    for (const k of keys) {
      const av = same && la.rows[k] ? la.rows[k].actual : null, bv = lb.rows[k] ? lb.rows[k].actual : null;
      if (bv != null && bv !== av) ops.push({ t: "actual", week: lb.weekEnding, key: k, amount: bv, source: src });
      else if (bv == null && av != null) ops.push({ t: "actual_delete", week: lb.weekEnding, key: k });
    }
  }
  return ops.concat(late);
}
function setStatus() {
  if (!CLOUD) return;
  const el = $("status");
  el.textContent = saveError ? "Not saved — " + saveError : saving ? "Saving…" : !canEdit() ? "View only" : "All changes saved";
  el.className = "status" + (saveError ? " dirty" : "");
}
function cloudSave(before, after) {
  const ops = diffOps(before, after).concat(extraOps.splice(0));
  if (!ops.length) return;
  queueCloud(async () => { const r = await sb.rpc("save_radar", { p_ops: ops }); if (r.error) throw r.error; });
}
function queueCloud(fn) {
  saving++; setStatus();
  saveChain = saveChain.then(fn).then(() => { saveError = null; }, async e => {
    saveError = e.message || String(e);
    alert("Radar couldn't save your last change:\n\n" + saveError + "\n\nReloading the latest saved version.");
    undoStack = []; await reloadFromServer(false);
  }).finally(() => { saving--; setStatus(); });
}
async function sha256Hex(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
// Store the original CSV and every transaction with its category.
function cloudImport(pi, weekEnding) {
  queueCloud(async () => {
    const sha = await sha256Hex(pi.text), path = `${weekEnding}/${sha.slice(0, 16)}-${pi.fileName.replace(/[^\w.-]+/g, "_")}`;
    const up = await sb.storage.from("bank-files").upload(path, new Blob([pi.text], { type: "text/csv" }), { upsert: false });
    if (up.error && !/exists|duplicate/i.test(up.error.message)) throw up.error;
    const seen = {}, txns = [];
    for (const t of pi.txns) {
      const k = [t.acct, t.date, t.amount.toFixed(2), t.desc, t.ref, t.ref2, t.text, t.type, t.trc].join("|");
      seen[k] = (seen[k] || 0) + 1;
      txns.push({ fp: await sha256Hex(k + "#" + seen[k]), acct: t.acct, acctName: t.acctName, date: t.date, amount: t.amount,
        desc: t.desc, ref: t.ref, ref2: t.ref2, text: t.text, type: t.type, trc: t.trc,
        line: t.lineId || "", manual: !!t.manual, rule: t.ruleId || "" });
    }
    const dates = pi.txns.map(t => t.date).sort();
    const r = await sb.rpc("import_bank_file", { p_file: { name: pi.fileName, path, sha256: sha, firstDate: dates[0],
      lastDate: dates[dates.length - 1], weekEnding }, p_txns: txns });
    if (r.error) throw r.error;
    toast(`Bank file saved: ${r.data.newTransactions} new transactions${r.data.alreadyKnown ? `, ${r.data.alreadyKnown} already on file` : ""}`);
  });
}
async function accessBox(box) {
  box.innerHTML = `<h3>Access</h3><p class="help">Signed in as <b>${esc(me.email)}</b> (${esc(myRole)}). <button class="link" id="a-out">Sign out</button></p>
    ${myRole === "admin" ? `<div id="a-list" class="help">Loading people…</div>
      <p class="help" style="margin:10px 0 0">Add someone by email. If they haven't signed in yet, they're invited and get access the first time they sign in.</p>
      <form id="a-add" class="a-add"><input id="a-email" type="email" placeholder="name@adn.com" required>
        <select id="a-role"><option value="viewer">Viewer</option><option value="editor">Editor</option><option value="admin">Admin</option></select>
        <button>Add</button></form>` : ""}`;
  $("a-out").onclick = () => sb.auth.signOut();
  if (myRole !== "admin") return;
  const list = async () => {
    const [mem, inv] = await Promise.all([sb.from("members").select("email, role").order("email"),
                                          sb.from("member_invites").select("email, role").order("email")]);
    const err = mem.error || inv.error;
    const row = (m, pending) => `<div class="a-row"><span>${esc(m.email)}${pending ? ' <span class="help">· invited, hasn\'t signed in yet</span>' : ""}</span>
      <span>${esc(m.role)}</span>${m.email === me.email ? "<span></span>" : `<button class="link danger" data-rm="${esc(m.email)}">remove</button>`}</div>`;
    $("a-list").innerHTML = err ? `<span class="neg">${esc(err.message)}</span>`
      : mem.data.map(m => row(m, false)).join("") + (inv.data || []).map(m => row(m, true)).join("");
    box.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
      if (!confirm(`Remove ${b.dataset.rm}'s access to Radar?`)) return;
      const r = await sb.rpc("remove_member", { p_email: b.dataset.rm }); if (r.error) alert(r.error.message); list(); });
  };
  $("a-add").onsubmit = async e => { e.preventDefault();
    const email = $("a-email").value.trim(), r = await sb.rpc("set_member", { p_email: email, p_role: $("a-role").value });
    if (r.error) alert(r.error.message);
    else { $("a-email").value = ""; toast(r.data === "invited" ? `Invited ${email}: they'll get access when they first sign in` : `${email} now has access`); }
    list(); };
  list();
}

/* ---------------- publish update (cloud mode) ---------------- */
window.__openMail = url => { location.href = url; };            // replaced in tests
async function loadLastPublished() {
  const { data } = await sb.from("forecast_publications").select("published_at, published_by_email, as_of")
    .order("published_at", { ascending: false }).limit(1);
  const p = data && data[0];
  $("published").textContent = p ? `Last published ${new Date(p.published_at).toLocaleDateString("en-US", { month: "short", day: "numeric" })} by ${p.published_by_email}` : "Not published yet";
}
function publishSummary() {
  const F = compute(), low = F.cols.reduce((m, c) => c.end < m.end ? c : m, F.cols[0]), last = F.cols[F.cols.length - 1];
  const lw = lastWeekTotals(), big = significantOutflows(F).items.filter(i => i.w <= F.weeks[3]).sort((a, b) => b.amt - a.amt).slice(0, 6)
    .sort((a, b) => a.w < b.w ? -1 : a.w > b.w ? 1 : b.amt - a.amt);
  const lines = [
    `• Cash today: ${fmtK(state.startingCash)}`,
    `• Lowest point: ${fmtK(low.end)} (week ending ${fmtDate(low.week)})${low.end < state.minCash ? ` — below the ${fmtK(state.minCash)} cushion` : ""}`,
    `• In 13 weeks: ${fmtK(last.end)}`];
  if (lw.hasActual) lines.push(`• Last week: ended ${fmtK(lw.aEnd)} vs. ${fmtK(lw.fEnd)} forecast (${lw.aEnd - lw.fEnd >= 0 ? "+" : ""}${fmt(lw.aEnd - lw.fEnd)})`);
  return { lines, big, low: Math.round(low.end), lowWeek: low.week, end13: Math.round(last.end),
    lastWeekVariance: lw.hasActual ? Math.round(lw.aEnd - lw.fEnd) : null };
}
async function publishDialog() {
  await saveChain;
  if (saveError) return alert("Please wait until your changes are saved, then publish.");
  const mem = await sb.from("members").select("email");
  if (mem.error) return alert(mem.error.message);
  const to = mem.data.map(m => m.email).filter(e => e.toLowerCase() !== me.email.toLowerCase());
  const S = publishSummary(), link = location.origin + location.pathname;
  const { value, d } = await modal({ title: "Publish this week's update", buttons: [
      { label: "Cancel", value: null, skipCheck: true }, { label: "Copy text instead", value: "copy" },
      { label: "Publish & open email", value: "mail", cls: "primary", validate: () => to.length ? null : "Nobody else has access yet. Add people in Settings → Access first." }],
    body: `<p>This records the update in Radar and opens an email from you to the <b>${to.length}</b> other ${to.length === 1 ? "person" : "people"} with access${to.length ? ` (${esc(to.join(", "))})` : ""}.</p>
      <label>Note to include (optional)</label><textarea name="note" rows="3" placeholder="e.g. Moved payroll a week later; added roof repair on Jan 8"></textarea>
      <div class="mlist"><b>The email will say</b>${S.lines.map(l => `<div>${esc(l)}</div>`).join("")}
        ${S.big.length ? `<div style="margin-top:6px">Big items in the next 4 weeks: ${S.big.length}</div>` : ""}</div>` });
  if (value !== "mail" && value !== "copy") return;
  const note = (d.querySelector("[name=note]").value || "").trim();
  const subject = `Radar: cash forecast updated (week ending ${fmtDate(state.asOf, { year: "numeric" })})`;
  const body = [`Radar has been updated for the week ending ${fmtDate(state.asOf, { year: "numeric" })}.`, "", ...S.lines,
    ...(S.big.length ? ["", "Big items in the next 4 weeks:", ...S.big.map(i => `• ${fmtDate(i.w)} — ${i.name}: ${fmt(i.amt)}`)] : []),
    ...(note ? ["", "Note: " + note] : []), "", "Open Radar: " + link].join("\n");
  const r = await sb.from("forecast_publications").insert({ as_of: state.asOf, note, recipients: to.length,
    summary: { low: S.low, lowWeek: S.lowWeek, end13: S.end13, lastWeekVariance: S.lastWeekVariance } });
  if (r.error) return alert("Couldn't publish: " + r.error.message);
  loadLastPublished();
  if (value === "copy") {
    try { await navigator.clipboard.writeText(subject + "\n\n" + body); toast("Published. Email text copied: paste it into a new email"); }
    catch (e) { prompt("Published. Copy this text into an email:", subject + "\n\n" + body); }
  } else {
    toast("Published. Your email app should open: just tap Send");
    window.__openMail(`mailto:${to.map(encodeURIComponent).join(",")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`);
  }
}
